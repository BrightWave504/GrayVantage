<script>
  // Automatically try common logo filenames.
  // The actual image must exist in the GitHub repository.

  const logo = document.getElementById("grayvantageLogo");

  const logoPaths = [
    "./assets/20261104-040004.png",
    "./assets/20261104-040004.jpg",
    "./assets/20261104-040004.jpeg",
    "./assets/logo.png",
    "./assets/logo.jpg",
    "./assets/logo.jpeg",
    "./20261104-040004.png",
    "./logo.png"
  ];

  let logoIndex = 0;

  logo.addEventListener("error", function () {
    logoIndex++;

    if (logoIndex < logoPaths.length) {
      logo.src = logoPaths[logoIndex];
    } else {
      console.error(
        "GrayVantage logo not found. Check the filename and image location in your GitHub repository."
      );
      logo.style.display = "none";
    }
  });
</script>
